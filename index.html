<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Empenhos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.login {
  max-width: 360px;
  margin: 120px auto;
  background: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,.1);
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.app {
  display: none;
  height: 100vh;
}

.container {
  display: flex;
  height: 100%;
}

.sidebar {
  width: 220px;
  background: #1e1e2f;
  color: #fff;
  padding: 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  margin: 10px 0;
  cursor: pointer;
}

.main {
  flex: 1;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Controle de Empenhos</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="container">
    <div class="sidebar">
      <h3>Menu</h3>
      <a onclick="mostrar('dashboard')">Dashboard</a>
      <a onclick="mostrar('empenhos')">Empenhos</a>
      <a onclick="mostrar('financeiro')">Financeiro</a>
      <a onclick="logout()">Sair</a>
    </div>

    <div class="main">
      <div id="dashboard" class="card">
        <h2>Dashboard</h2>
        <p>Login realizado com sucesso.</p>
      </div>

      <div id="empenhos" class="card" style="display:none">
        <h2>Empenhos</h2>
        <p>Área de empenhos</p>
      </div>

      <div id="financeiro" class="card" style="display:none">
        <h2>Financeiro</h2>
        <p>Área financeira</p>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_fU_TGvlrNUxYmc0LR6knqmk5D7pBt8A",
  authDomain: "controle-de-empenhos-ad66b.firebaseapp.com",
  projectId: "controle-de-empenhos-ad66b",
  storageBucket: "controle-de-empenhos-ad66b.appspot.com",
  messagingSenderId: "885070566816",
  appId: "1:885070566816:web:742fcf70cc562359cc00c5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login() {
  auth.signInWithEmailAndPassword(
    email.value,
    senha.value
  ).catch(e => alert(e.message));
}

function logout() {
  auth.signOut();
}
