<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle de Empenhos</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body { margin: 0; background: #f4f6f8; }

    /* LOGIN */
    #login {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }
    .login-box h2 { margin-bottom: 20px; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    /* DASHBOARD */
    #app { display: none; height: 100vh; }

    .sidebar {
      width: 220px;
      background: #111827;
      color: #fff;
      padding: 20px;
      transition: width .3s;
    }
    .sidebar.hidden { width: 60px; }
    .sidebar h3 { margin-top: 0; }
    .sidebar button {
      width: 100%;
      margin-top: 10px;
      background: none;
      border: none;
      color: #fff;
      text-align: left;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }
    .sidebar button:hover { background: #1f2937; }

    .main {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .toggle {
      font-size: 20px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    th { background: #f1f5f9; }

    .status {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #fff;
    }
    .recebido { background: #f59e0b; }
    .despachado { background: #3b82f6; }
    .entregue { background: #16a34a; }

    @media (max-width: 768px) {
      .sidebar { position: absolute; z-index: 10; height: 100%; }
      .sidebar.hidden { transform: translateX(-100%); }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>Controle de Empenhos</h2>
    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:flex;">
  <div class="sidebar" id="sidebar">
    <h3>Menu</h3>
    <button>📄 Empenhos</button>
    <button>💰 Financeiro</button>
    <button onclick="logout()">🚪 Sair</button>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="toggle" onclick="toggleMenu()">☰</span>
      <h2>Empenhos</h2>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nº Empenho</th>
          <th>UASG</th>
          <th>Pregão</th>
          <th>Valor</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabela">
        <tr>
          <td>12345</td>
          <td>987654</td>
          <td>12/2025</td>
          <td>R$ 4.500,00</td>
          <td><span class="status recebido">Recebido</span></td>
        </tr>
        <tr>
          <td>12346</td>
          <td>123456</td>
          <td>22/2025</td>
          <td>R$ 8.200,00</td>
          <td><span class="status entregue">Entregue</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 🔐 Firebase config (SEU)
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN",
    projectId: "SEU_PROJECT_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    if (user) {
      login.style.display = "none";
      app.style.display = "flex";
    } else {
      login.style.display = "flex";
      app.style.display = "none";
    }
  });

  function login() {
    auth.signInWithEmailAndPassword(
      email.value,
      senha.value
    ).catch(e => alert(e.message));
  }

  function logout() {
    auth.signOut();
  }

  function toggleMenu() {
    sidebar.classList.toggle("hidden");
  }
</script>

</body>
</html>
