<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Empenhos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.login {
  max-width: 360px;
  margin: 120px auto;
  background: #fff;
  padding: 30px;
  border-radius: 8px;
}

input, select, button {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
}

button {
  background: #1976d2;
  color: #fff;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}

.app {
  display: none;
  height: 100vh;
}

.container {
  display: flex;
  height: 100%;
}

.sidebar {
  width: 220px;
  background: #1e1e2f;
  color: #fff;
  padding: 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  margin: 10px 0;
  cursor: pointer;
}

.main {
  flex: 1;
  padding: 20px;
  overflow: auto;
}

.cards {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 6px;
  flex: 1;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  border: 1px solid #ddd;
  padding: 8px;
}

th {
  background: #eee;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #fff;
  padding: 20px;
  width: 320px;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Controle de Empenhos</h2>
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <button id="btnLogin">Entrar</button>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="container">
    <div class="sidebar">
      <h3>Menu</h3>
      <a>📄 Empenhos</a>
      <a onclick="logout()">🚪 Sair</a>
    </div>

    <div class="main">
      <div class="cards">
        <div class="card">
          <strong>Total de Empenhos</strong>
          <div id="totalQtd">0</div>
        </div>
        <div class="card">
          <strong>Valor Total</strong>
          <div id="totalValor">R$ 0,00</div>
        </div>
      </div>

      <button onclick="abrirModal()">+ Novo Empenho</button>

      <table>
        <thead>
          <tr>
            <th>Nº Empenho</th>
            <th>UASG</th>
            <th>Pregão</th>
            <th>Data</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Rastreio</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Novo Empenho</h3>
    <input id="mEmpenho" placeholder="Nº Empenho">
    <input id="mUasg" placeholder="UASG">
    <input id="mPregao" placeholder="Pregão">
    <input id="mData" type="date">
    <input id="mValor" type="number" placeholder="Valor">
    <select id="mStatus">
      <option>Recebido</option>
      <option>Despachado</option>
      <option>Entregue</option>
    </select>
    <input id="mRastreio" placeholder="Código de Rastreio">
    <button onclick="salvar()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC_fU_TGvlrNUxYmc0LR6knqmk5D7pBt8A",
  authDomain: "controle-de-empenhos-ad66b.firebaseapp.com",
  projectId: "controle-de-empenhos-ad66b",
  storageBucket: "controle-de-empenhos-ad66b.appspot.com",
  messagingSenderId: "885070566816",
  appId: "1:885070566816:web:742fcf70cc562359cc00c5"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const loginBox = document.getElementById("loginBox");
const app = document.getElementById("app");
const tabela = document.getElementById("tabela");

document.getElementById("btnLogin").onclick = () => {
  auth.signInWithEmailAndPassword(
    email.value,
    senha.value
  ).catch(e => alert(e.message));
};

auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    app.style.display = "block";
    carregar();
  }
});

function logout() {
  auth.signOut();
}

function abrirModal() {
  modal.style.display = "flex";
}
function fecharModal() {
  modal.style.display = "none";
}

function salvar() {
  db.collection("empenhos").add({
    empenho: mEmpenho.value,
    uasg: mUasg.value,
    pregao: mPregao.value,
    data: mData.value,
    valor: Number(mValor.value),
    status: mStatus.value,
    rastreio: mRastreio.value
  }).then(() => {
    fecharModal();
    carregar();
  });
}

function carregar() {
  tabela.innerHTML = "";
  let total = 0;
  db.collection("empenhos").get().then(snap => {
    document.getElementById("totalQtd").innerText = snap.size;
    snap.forEach(doc => {
      const d = doc.data();
      total += d.valor;
      tabela.innerHTML += `
        <tr>
          <td>${d.empenho}</td>
          <td>${d.uasg}</td>
          <td>${d.pregao}</td>
          <td>${d.data}</td>
          <td>R$ ${d.valor.toFixed(2)}</td>
          <td>${d.status}</td>
          <td>${d.rastreio}</td>
          <td><button onclick="db.collection('empenhos').doc('${doc.id}').delete().then(carregar)">Excluir</button></td>
        </tr>`;
    });
    document.getElementById("totalValor").innerText =
      "R$ " + total.toFixed(2);
  });
}
</script>

</body>
</html>
