<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Empenhos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
    }

    .login {
      max-width: 360px;
      margin: 100px auto;
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }

    .login h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #1976d2;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #125aa0;
    }

    .app {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #1e1e2f;
      color: #fff;
      padding: 20px;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      color: #fff;
      text-decoration: none;
      margin: 10px 0;
      cursor: pointer;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      padding: 20px;
      background: #f4f6f8;
    }

    .container {
      display: flex;
      height: 100%;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #eee;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
  <h2>Controle de Empenhos</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="container">

    <div class="sidebar">
      <h3>Menu</h3>
      <a onclick="mostrar('dashboard')">Dashboard</a>
      <a onclick="mostrar('empenhos')">Empenhos</a>
      <a onclick="mostrar('financeiro')">Financeiro</a>
      <a onclick="logout()">Sair</a>
    </
