<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Empenhos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    /* LOGIN */
    .login-box {
      max-width: 360px;
      margin: 120px auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* DASHBOARD */
    .app {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #1f2937;
      color: #fff;
      padding: 20px;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      margin: 10px 0;
    }

    .content {
      flex: 1;
      padding: 20px;
    }

    .layout {
      display: flex;
      height: 100%;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
  <h2>Controle de Empenhos</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<!-- DASHBOARD -->
<div class="app" id="app">
  <div class="layout">
    <div class="sidebar">
      <h3>Menu</h3>
      <a href="#">Dashboard</a>
      <a href="#">Empenhos</a>
      <a href="#">Financeiro</a>
      <a href="#" onclick="logout()">Sair</a>
    </div>

    <div class="content">
      <h1>Dashboard</h1>
      <p>Login realizado com sucesso.</p>
    </div>
  </div>
</div>

<!-- FIREBASE (VERSÃO SIMPLES E FUNCIONAL) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  // CONFIG FIREBASE (SEU)
  var firebaseConfig = {
    apiKey: "AIzaSyC_fU_TGvlrNUxYmc0LR6knqmk5D7pBt8A",
    authDomain: "controle-de-empenhos-ad66b.firebaseapp.com",
    projectId: "controle-de-empenhos-ad66b",
    storageBucket: "controle-de-empenhos-ad66b.appspot.com",
    messagingSenderId: "885070566816",
    appId: "1:885070566816:web:742fcf70cc562359cc00c5"
  };

  firebase.initializeApp(firebaseConfig);

  function login() {
    var email = document.getElementById("email").value;
    var senha = document.getElementById("senha").value;

    firebase.auth().signInWithEmailAndPassword(email, senha)
      .then(function () {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("app").style.display = "block";
      })
      .catch(function (error) {
        alert(error.message);
      });
  }

  function logout() {
    firebase.auth().signOut().then(function () {
      location.reload();
    });
  }
</script>

</body>
</html>
